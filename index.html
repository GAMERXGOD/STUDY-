<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna — a quiet place to study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#161027;
    --midnight-2:#1f1836;
    --card:#241c3d;
    --card-edge:#352a56;
    --moonlight:#f2ecff;
    --moonlight-dim:#c8bfe0;
    --gold:#ffd77a;
    --gold-dim:#a68a4c;
    --accent:#c9a6ff;
    --accent-2:#8f7bd8;
    --accent-glow:rgba(201,166,255,0.55);
    --rose:#f0a8c9;
    --ok:#9fe3c0;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    --sky-1:#0d0a1c;
    --sky-2:#241a3d;
    --sky-3:#4a3163;
    --sky-4:#7a4d72;
    --star-color:#f2ecff;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><path d="M14 2 L16.2 10.8 L25 14 L16.2 17.2 L14 26 L11.8 17.2 L3 14 L11.8 10.8 Z" fill="%23c9a6ff" opacity="0.95"/></svg>') 14 14, auto;
  }

  [data-theme="rose"]{ --accent:#f0a8c9; --accent-2:#d97aa8; --accent-glow:rgba(240,168,201,0.5); --gold:#ffd7a0; }
  [data-theme="emerald"]{ --accent:#8fe3c0; --accent-2:#5bc79a; --accent-glow:rgba(143,227,192,0.5); --gold:#e8e08a; }
  [data-theme="amber"]{ --accent:#ffcf8a; --accent-2:#e8a94f; --accent-glow:rgba(255,207,138,0.5); --gold:#ffe8a3; }
  [data-theme="amethyst"]{ --accent:#c39bff; --accent-2:#9463e0; --accent-glow:rgba(195,155,255,0.55); --gold:#e0c8ff; }

  [data-bg="forest"]{ --sky-1:#0d0a1c; --sky-2:#241a3d; --sky-3:#4a3163; --sky-4:#7a4d72; }
  [data-bg="aurora"]{ --sky-1:#081522; --sky-2:#0d2b3a; --sky-3:#1c5c4f; --sky-4:#4fae8f; }
  [data-bg="blossom"]{ --sky-1:#160c1c; --sky-2:#2c1330; --sky-3:#5c2a4d; --sky-4:#a8567f; }
  [data-bg="nebula"]{ --sky-1:#0a0a1c; --sky-2:#1c1240; --sky-3:#3d1e5c; --sky-4:#7a2ea0; }
  [data-bg="garden"]{ --sky-1:#0c1610; --sky-2:#152a1f; --sky-3:#26523a; --sky-4:#4f8f5e; }
  [data-bg="ocean"]{ --sky-1:#050e1c; --sky-2:#0a2035; --sky-3:#123a54; --sky-4:#1f6a8a; }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand',sans-serif;
    color:var(--moonlight);
    background:
      radial-gradient(ellipse at 50% 100%, var(--sky-4) 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 45%, var(--sky-3) 75%, var(--sky-4) 100%);
    overflow-x:hidden;
    position:relative;
    transition:background 1.2s ease;
  }

  #stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .star{ position:absolute; border-radius:50%; background:var(--star-color); opacity:0.7; animation:twinkle var(--dur,3s) ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:0.15; } 50%{ opacity:0.9; } }

  .firefly{ position:fixed; width:5px; height:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px 3px var(--gold); opacity:0.7; z-index:0; pointer-events:none; animation:drift linear infinite; }
  @keyframes drift{
    0%{ transform:translate(0,0); opacity:0; }
    10%{ opacity:0.8; }
    50%{ transform:translate(30px,-60px); }
    90%{ opacity:0.6; }
    100%{ transform:translate(-20px,-140px); opacity:0; }
  }

  h1,h2,h3{ font-family:'Cormorant Garamond',serif; font-weight:600; margin:0; }

  .wrap{ position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:28px 24px 60px; }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:38px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .glyph{ font-size:26px; filter:drop-shadow(0 0 6px var(--accent-glow)); }
  .brand h1{ font-size:26px; letter-spacing:0.5px; color:var(--moonlight); }
  .brand p{ margin:2px 0 0; font-size:12.5px; color:var(--moonlight-dim); }

  .pill{ display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.06); border:1px solid var(--card-edge); backdrop-filter:blur(6px); padding:9px 16px; border-radius:999px; font-size:15px; }
  .pill .n{ font-weight:700; color:var(--moonlight); }
  .stat-group{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .btn{ font-family:'Quicksand',sans-serif; font-weight:600; border:none; cursor:inherit; border-radius:999px; padding:10px 20px; font-size:14.5px; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; }
  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#1a1330; box-shadow:0 6px 20px var(--accent-glow); }
  .btn-primary:hover{ box-shadow:0 8px 26px var(--accent-glow); }
  .btn-ghost{ background:rgba(255,255,255,0.07); color:var(--moonlight); border:1px solid var(--card-edge); }
  .btn-ghost:hover{ background:rgba(255,255,255,0.12); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  /* ---------- main layout ---------- */
  .layout{ display:grid; grid-template-columns:1.15fr 0.85fr; gap:26px; align-items:start; }
  @media (max-width:880px){ .layout{ grid-template-columns:1fr; } }

  .card{ background:linear-gradient(160deg, rgba(36,28,61,0.75), rgba(28,22,49,0.75)); border:1px solid var(--card-edge); border-radius:var(--radius-lg); padding:30px; backdrop-filter:blur(10px); box-shadow:0 20px 50px rgba(0,0,0,0.35); }

  /* ---------- timer ---------- */
  .timer-card{ display:flex; flex-direction:column; align-items:center; gap:22px; }
  .modes{ display:flex; gap:8px; background:rgba(0,0,0,0.2); padding:6px; border-radius:999px; }
  .mode-btn{ font-family:'Quicksand',sans-serif; font-weight:600; font-size:13.5px; padding:8px 16px; border-radius:999px; border:none; background:transparent; color:var(--moonlight-dim); cursor:inherit; transition:all .2s ease; }
  .mode-btn.active{ background:var(--accent); color:#1a1330; }

  .moon-wrap{ position:relative; width:280px; height:280px; }
  .moon-wrap svg{ transform:rotate(-90deg); }
  .moon-track{ fill:none; stroke:rgba(255,255,255,0.08); stroke-width:10; }
  .moon-progress{ fill:none; stroke:url(#moonGrad); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s linear; filter:drop-shadow(0 0 10px var(--accent-glow)); }
  .moon-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .time-readout{ font-family:'Cormorant Garamond',serif; font-size:64px; font-weight:600; letter-spacing:1px; color:var(--moonlight); font-variant-numeric:tabular-nums; }
  .time-label{ font-size:13px; color:var(--moonlight-dim); letter-spacing:0.5px; }
  .session-dots{ display:flex; gap:6px; margin-top:2px; }
  .session-dots span{ width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.2); }
  .session-dots span.done{ background:var(--gold); box-shadow:0 0 6px var(--gold); }

  .controls{ display:flex; gap:12px; align-items:center; }
  .icon-btn{ width:44px; height:44px; border-radius:50%; border:1px solid var(--card-edge); background:rgba(255,255,255,0.06); color:var(--moonlight); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:inherit; }
  .icon-btn:hover{ background:rgba(255,255,255,0.12); }
  .start-btn{ padding:14px 40px; font-size:16px; }

  .mins-row{ display:flex; gap:18px; font-size:12.5px; color:var(--moonlight-dim); }
  .mins-row label{ display:flex; align-items:center; gap:6px; }
  .mins-row input{ width:48px; background:rgba(0,0,0,0.25); border:1px solid var(--card-edge); color:var(--moonlight); border-radius:8px; padding:4px 6px; font-family:'Quicksand',sans-serif; text-align:center; }

  /* ---------- streak ---------- */
  .streak-strip{ display:flex; align-items:center; gap:10px; }
  .streak-day{ width:11px; height:11px; border-radius:3px; background:rgba(255,255,255,0.1); }
  .streak-day.lit{ background:linear-gradient(135deg, #ffb45c, var(--gold)); box-shadow:0 0 8px rgba(255,183,92,0.7); }

  /* ---------- quest / notes card ---------- */
  .quest-card{ display:flex; flex-direction:column; gap:16px; height:100%; }
  .quest-head{ display:flex; align-items:center; justify-content:space-between; }
  .quest-add{ display:flex; gap:8px; }
  .quest-add input{ flex:1; background:rgba(0,0,0,0.22); border:1px solid var(--card-edge); color:var(--moonlight); border-radius:12px; padding:11px 14px; font-family:'Quicksand',sans-serif; font-size:14.5px; }
  .quest-add input::placeholder{ color:var(--moonlight-dim); }
  .quest-add button{ padding:0 18px; border-radius:12px; }

  .quest-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto; }
  .quest-list::-webkit-scrollbar{ width:6px; }
  .quest-list::-webkit-scrollbar-thumb{ background:var(--card-edge); border-radius:4px; }
  .quest-item{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.05); border-radius:12px; padding:10px 12px; }
  .quest-check{ width:19px; height:19px; border-radius:6px; border:1.5px solid var(--accent); flex-shrink:0; cursor:inherit; display:flex; align-items:center; justify-content:center; background:transparent; color:#1a1330; font-size:12px; }
  .quest-check.checked{ background:var(--accent); }
  .quest-text{ flex:1; font-size:14.5px; }
  .quest-item.checked .quest-text{ text-decoration:line-through; color:var(--moonlight-dim); }
  .quest-del{ background:none; border:none; color:var(--moonlight-dim); cursor:inherit; font-size:15px; opacity:0.5; }
  .quest-del:hover{ opacity:1; color:var(--rose); }
  .quest-empty{ font-size:13.5px; color:var(--moonlight-dim); text-align:center; padding:30px 10px; }

  /* ---------- store modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(8,6,18,0.7); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.open{ display:flex; }
  .store-modal{ width:100%; max-width:720px; max-height:85vh; overflow-y:auto; background:linear-gradient(160deg, var(--midnight-2), var(--midnight)); border:1px solid var(--card-edge); border-radius:var(--radius-lg); padding:28px; }
  .store-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .store-tabs{ display:flex; gap:8px; margin-bottom:20px; }
  .store-tab{ font-family:'Quicksand',sans-serif; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px; border:1px solid var(--card-edge); background:transparent; color:var(--moonlight-dim); cursor:inherit; }
  .store-tab.active{ background:var(--accent); color:#1a1330; border-color:transparent; }
  .store-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .store-item{ background:rgba(255,255,255,0.04); border:1px solid var(--card-edge); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .swatch{ height:70px; border-radius:12px; }
  .cursor-swatch{ height:70px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; background:rgba(255,255,255,0.05); }
  .item-name{ font-size:14px; font-weight:600; }
  .item-price{ font-size:12.5px; color:var(--gold); display:flex; align-items:center; gap:4px; }
  .item-btn{ width:100%; padding:8px; border-radius:10px; font-size:13px; }
  .item-btn.owned{ background:rgba(159,227,192,0.15); color:var(--ok); border:1px solid rgba(159,227,192,0.3); }
  .item-btn.equipped{ background:rgba(255,255,255,0.1); color:var(--moonlight-dim); }

  .close-x{ background:none; border:none; color:var(--moonlight-dim); font-size:20px; cursor:inherit; }

  /* ---------- toast ---------- */
  .toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(30,22,52,0.95); border:1px solid var(--card-edge); padding:12px 22px; border-radius:999px; font-size:14px; opacity:0; transition:all .35s ease; z-index:80; display:flex; align-items:center; gap:8px; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .sparkle-burst{ position:fixed; pointer-events:none; z-index:70; font-size:20px; animation:burst 1.1s ease-out forwards; }
  @keyframes burst{ 0%{ transform:translateY(0) scale(0.6); opacity:1; } 100%{ transform:translateY(-90px) scale(1.3); opacity:0; } }

  footer{ text-align:center; margin-top:50px; font-size:12px; color:var(--moonlight-dim); position:relative; z-index:2; }
</style>
</head>
<body data-theme="moonlight" data-bg="forest">

<div id="stars"></div>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="glyph">☾</span>
      <div>
        <h1>Luna</h1>
        <p>a quiet place to study</p>
      </div>
    </div>
    <div class="stat-group">
      <div class="pill" title="Study streak">🔥 <span class="n" id="streakCount">0</span> day streak</div>
      <div class="pill" title="Starlight coins">✦ <span class="n" id="coinCount">0</span></div>
      <button class="btn btn-ghost" id="openStore">Store</button>
    </div>
  </div>

  <div class="layout">
    <div class="card timer-card">
      <div class="modes">
        <button class="mode-btn active" data-mode="focus">Focus</button>
        <button class="mode-btn" data-mode="short">Short rest</button>
        <button class="mode-btn" data-mode="long">Long rest</button>
      </div>

      <div class="moon-wrap">
        <svg width="280" height="280" viewBox="0 0 280 280">
          <defs>
            <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--accent)"/>
              <stop offset="100%" stop-color="var(--gold)"/>
            </linearGradient>
          </defs>
          <circle class="moon-track" cx="140" cy="140" r="120"></circle>
          <circle class="moon-progress" id="moonProgress" cx="140" cy="140" r="120" stroke-dasharray="754" stroke-dashoffset="754"></circle>
        </svg>
        <div class="moon-center">
          <div class="time-readout" id="timeReadout">25:00</div>
          <div class="time-label" id="timeLabel">focus session</div>
          <div class="session-dots" id="sessionDots"></div>
        </div>
      </div>

      <div class="controls">
        <button class="icon-btn" id="resetBtn" title="Reset">↺</button>
        <button class="btn btn-primary start-btn" id="startBtn">Begin</button>
        <button class="icon-btn" id="skipBtn" title="Skip">⏭</button>
      </div>

      <div class="mins-row">
        <label>focus <input type="number" id="focusMin" min="5" max="90" value="25"></label>
        <label>short <input type="number" id="shortMin" min="1" max="30" value="5"></label>
        <label>long <input type="number" id="longMin" min="5" max="60" value="15"></label>
      </div>
    </div>

    <div class="card quest-card">
      <div class="quest-head">
        <h2 style="font-size:21px;">today's quests</h2>
        <span style="font-size:12.5px;color:var(--moonlight-dim);" id="questProgress">0/0</span>
      </div>
      <div class="quest-add">
        <input type="text" id="questInput" placeholder="write something to study today…" maxlength="120">
        <button class="btn btn-primary" id="addQuest">Add</button>
      </div>
      <ul class="quest-list" id="questList"></ul>
      <div>
        <div style="font-size:12px;color:var(--moonlight-dim);margin-bottom:8px;">streak this week</div>
        <div class="streak-strip" id="streakStrip"></div>
      </div>
    </div>
  </div>

  <footer>every focused minute grows your streak and your starlight — spend it well ✦</footer>
</div>

<!-- store -->
<div class="overlay" id="storeOverlay">
  <div class="store-modal">
    <div class="store-head">
      <h2 style="font-size:23px;">the starlight store</h2>
      <button class="close-x" id="closeStore">✕</button>
    </div>
    <div style="font-size:13px;color:var(--moonlight-dim);margin-bottom:16px;">you have <span style="color:var(--gold);font-weight:700;" id="storeCoinCount">0</span> ✦ starlight</div>
    <div class="store-tabs">
      <button class="store-tab active" data-tab="bg">backgrounds</button>
      <button class="store-tab" data-tab="theme">themes</button>
      <button class="store-tab" data-tab="cursor">cursors</button>
    </div>
    <div class="store-grid" id="storeGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------- data ----------------
  const STORAGE_KEY = "luna_pomodoro_v1";
  const today = () => new Date().toISOString().slice(0,10);

  const BACKGROUNDS = [
    { id:"forest",  name:"Twilight Forest", price:0,   grad:"linear-gradient(160deg,#0d0a1c,#4a3163,#7a4d72)" },
    { id:"aurora",  name:"Aurora Dreams",   price:90,  grad:"linear-gradient(160deg,#081522,#1c5c4f,#4fae8f)" },
    { id:"blossom", name:"Blossom Night",   price:110, grad:"linear-gradient(160deg,#160c1c,#5c2a4d,#a8567f)" },
    { id:"nebula",  name:"Cosmic Nebula",   price:140, grad:"linear-gradient(160deg,#0a0a1c,#3d1e5c,#7a2ea0)" },
    { id:"garden",  name:"Enchanted Garden",price:120, grad:"linear-gradient(160deg,#0c1610,#26523a,#4f8f5e)" },
    { id:"ocean",   name:"Starlit Ocean",   price:130, grad:"linear-gradient(160deg,#050e1c,#123a54,#1f6a8a)" }
  ];
  const THEMES = [
    { id:"moonlight", name:"Moonlight", price:0,  a:"#c9a6ff", b:"#8f7bd8" },
    { id:"rose",      name:"Rose Quartz", price:70, a:"#f0a8c9", b:"#d97aa8" },
    { id:"emerald",   name:"Emerald Fae", price:80, a:"#8fe3c0", b:"#5bc79a" },
    { id:"amber",     name:"Golden Hour", price:80, a:"#ffcf8a", b:"#e8a94f" },
    { id:"amethyst",  name:"Amethyst",    price:100,a:"#c39bff", b:"#9463e0" }
  ];
  const CURSORS = [
    { id:"sparkle", name:"Sparkle", price:0,  emoji:"✦", color:"c9a6ff" },
    { id:"star",    name:"Star",    price:50, emoji:"⭐", color:"ffd77a" },
    { id:"feather", name:"Feather", price:60, emoji:"🪶", color:"f2ecff" },
    { id:"flower",  name:"Flower",  price:60, emoji:"🌸", color:"f0a8c9" },
    { id:"firefly", name:"Firefly", price:70, emoji:"🌟", color:"ffe8a3" }
  ];

  function defaultState(){
    return {
      coins: 20,
      totalFocusMinutes: 0,
      lastActiveDate: null,
      streak: 0,
      activeDates: [],
      quests: [],
      owned: { bg:["forest"], theme:["moonlight"], cursor:["sparkle"] },
      equipped: { bg:"forest", theme:"moonlight", cursor:"sparkle" },
      minutes: { focus:25, short:5, long:15 },
      sessionsToday: 0
    };
  }

  let state;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  }catch(e){ state = defaultState(); }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  // ---------------- stars & fireflies ----------------
  const starsEl = document.getElementById("stars");
  function buildStars(){
    starsEl.innerHTML = "";
    const n = 90;
    for(let i=0;i<n;i++){
      const s = document.createElement("div");
      s.className = "star";
      const size = Math.random()*2 + 1;
      s.style.width = size+"px";
      s.style.height = size+"px";
      s.style.left = Math.random()*100+"vw";
      s.style.top = Math.random()*70+"vh";
      s.style.setProperty("--dur", (2+Math.random()*4)+"s");
      s.style.animationDelay = (Math.random()*4)+"s";
      starsEl.appendChild(s);
    }
  }
  buildStars();

  function spawnFirefly(){
    const f = document.createElement("div");
    f.className = "firefly";
    f.style.left = (10 + Math.random()*80)+"vw";
    f.style.top = (60 + Math.random()*30)+"vh";
    f.style.animationDuration = (6+Math.random()*5)+"s";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 11000);
  }
  setInterval(spawnFirefly, 1400);
  for(let i=0;i<4;i++) setTimeout(spawnFirefly, i*400);

  // ---------------- theming ----------------
  function applyEquipped(){
    document.body.setAttribute("data-theme", state.equipped.theme);
    document.body.setAttribute("data-bg", state.equipped.bg);
    const cur = CURSORS.find(c=>c.id===state.equipped.cursor) || CURSORS[0];
    const svg = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30"><text x="0" y="24" font-size="24">${encodeURIComponent(cur.emoji)}</text></svg>`;
    document.documentElement.style.cursor = `url('${svg}') 14 14, auto`;
    document.body.style.cursor = `url('${svg}') 14 14, auto`;
  }

  // ---------------- toast ----------------
  let toastTimer;
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
  }

  function burstSparkles(x,y){
    const symbols = ["✦","✧","⋆","✩"];
    for(let i=0;i<6;i++){
      const s = document.createElement("div");
      s.className = "sparkle-burst";
      s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
      s.style.left = (x + (Math.random()*60-30))+"px";
      s.style.top = (y + (Math.random()*20-10))+"px";
      s.style.color = "var(--gold)";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 1200);
    }
  }

  // ---------------- streak ----------------
  function refreshStreakUI(){
    document.getElementById("streakCount").textContent = state.streak;
    const strip = document.getElementById("streakStrip");
    strip.innerHTML = "";
    const days = [];
    for(let i=6;i>=0;i--){
      const d = new Date();
      d.setDate(d.getDate()-i);
      days.push(d.toISOString().slice(0,10));
    }
    days.forEach(d=>{
      const el = document.createElement("div");
      el.className = "streak-day" + (state.activeDates.includes(d) ? " lit" : "");
      el.title = d;
      strip.appendChild(el);
    });
  }

  function registerActiveDay(){
    const t = today();
    if(state.lastActiveDate === t) return;
    if(state.lastActiveDate){
      const prev = new Date(state.lastActiveDate);
      const cur = new Date(t);
      const diffDays = Math.round((cur - prev) / 86400000);
      if(diffDays === 1){ state.streak += 1; }
      else if(diffDays > 1){ state.streak = 1; }
    } else {
      state.streak = 1;
    }
    state.lastActiveDate = t;
    if(!state.activeDates.includes(t)) state.activeDates.push(t);
    state.activeDates = state.activeDates.slice(-30);
    save();
    refreshStreakUI();
  }

  // ---------------- coins ----------------
  function refreshCoinUI(){
    document.getElementById("coinCount").textContent = state.coins;
    document.getElementById("storeCoinCount").textContent = state.coins;
  }
  function earnCoins(n, x, y){
    state.coins += n;
    save();
    refreshCoinUI();
    if(x!==undefined) burstSparkles(x,y);
    renderStore();
  }

  // ---------------- quests ----------------
  const questList = document.getElementById("questList");
  function renderQuests(){
    questList.innerHTML = "";
    if(state.quests.length===0){
      const empty = document.createElement("div");
      empty.className = "quest-empty";
      empty.textContent = "no quests yet — add what you want to study today ✦";
      questList.appendChild(empty);
    }
    state.quests.forEach((q, idx)=>{
      const li = document.createElement("li");
      li.className = "quest-item" + (q.done ? " checked" : "");
      const check = document.createElement("button");
      check.className = "quest-check" + (q.done ? " checked" : "");
      check.textContent = q.done ? "✓" : "";
      check.onclick = ()=>{ state.quests[idx].done = !state.quests[idx].done; save(); renderQuests(); };
      const text = document.createElement("div");
      text.className = "quest-text";
      text.textContent = q.text;
      const del = document.createElement("button");
      del.className = "quest-del";
      del.textContent = "✕";
      del.onclick = ()=>{ state.quests.splice(idx,1); save(); renderQuests(); };
      li.append(check, text, del);
      questList.appendChild(li);
    });
    const done = state.quests.filter(q=>q.done).length;
    document.getElementById("questProgress").textContent = `${done}/${state.quests.length}`;
  }
  document.getElementById("addQuest").onclick = addQuest;
  document.getElementById("questInput").addEventListener("keydown", e=>{ if(e.key==="Enter") addQuest(); });
  function addQuest(){
    const input = document.getElementById("questInput");
    const val = input.value.trim();
    if(!val) return;
    state.quests.push({ text: val, done:false });
    input.value = "";
    save();
    renderQuests();
  }
  renderQuests();

  // ---------------- store ----------------
  let storeTab = "bg";
  document.querySelectorAll(".store-tab").forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll(".store-tab").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      storeTab = btn.dataset.tab;
      renderStore();
    };
  });

  function renderStore(){
    const grid = document.getElementById("storeGrid");
    grid.innerHTML = "";
    let items, ownedKey;
    if(storeTab==="bg"){ items = BACKGROUNDS; ownedKey="bg"; }
    else if(storeTab==="theme"){ items = THEMES; ownedKey="theme"; }
    else { items = CURSORS; ownedKey="cursor"; }

    items.forEach(it=>{
      const owned = state.owned[ownedKey].includes(it.id);
      const equipped = state.equipped[ownedKey]===it.id;
      const card = document.createElement("div");
      card.className = "store-item";

      let swatch;
      if(storeTab==="bg"){
        swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.background = it.grad;
      } else if(storeTab==="theme"){
        swatch = document.createElement("div");
        swatch.className = "swatch";
        swatch.style.background = `linear-gradient(135deg, ${it.a}, ${it.b})`;
      } else {
        swatch = document.createElement("div");
        swatch.className = "cursor-swatch";
        swatch.textContent = it.emoji;
      }

      const name = document.createElement("div");
      name.className = "item-name";
      name.textContent = it.name;

      const price = document.createElement("div");
      price.className = "item-price";
      price.textContent = it.price===0 ? "included" : `✦ ${it.price}`;

      const btn = document.createElement("button");
      btn.className = "btn item-btn";
      if(equipped){ btn.textContent = "equipped"; btn.classList.add("equipped"); btn.disabled = true; }
      else if(owned){ btn.textContent = "equip"; btn.classList.add("owned");
        btn.onclick = ()=>{ state.equipped[ownedKey]=it.id; save(); applyEquipped(); renderStore(); toast(`${it.name} equipped ✦`); };
      } else {
        btn.textContent = "buy";
        btn.classList.add("btn-primary");
        if(state.coins < it.price) btn.disabled = true;
        btn.onclick = ()=>{
          if(state.coins < it.price) return;
          state.coins -= it.price;
          state.owned[ownedKey].push(it.id);
          state.equipped[ownedKey] = it.id;
          save();
          applyEquipped();
          refreshCoinUI();
          renderStore();
          toast(`${it.name} is yours ✦`);
        };
      }

      card.append(swatch, name, price, btn);
      grid.appendChild(card);
    });
  }

  const storeOverlay = document.getElementById("storeOverlay");
  document.getElementById("openStore").onclick = ()=>{ storeOverlay.classList.add("open"); renderStore(); };
  document.getElementById("closeStore").onclick = ()=> storeOverlay.classList.remove("open");
  storeOverlay.addEventListener("click", e=>{ if(e.target===storeOverlay) storeOverlay.classList.remove("open"); });

  // ---------------- timer ----------------
  let mode = "focus"; // focus | short | long
  let secondsLeft = state.minutes.focus*60;
  let totalSeconds = secondsLeft;
  let running = false;
  let tickHandle = null;
  let focusSecondsAccum = 0; // for coin awarding within a session

  const timeReadout = document.getElementById("timeReadout");
  const timeLabel = document.getElementById("timeLabel");
  const startBtn = document.getElementById("startBtn");
  const moonProgress = document.getElementById("moonProgress");
  const CIRC = 2 * Math.PI * 120;
  moonProgress.setAttribute("stroke-dasharray", CIRC.toFixed(1));

  const labelFor = { focus:"focus session", short:"short rest", long:"long rest" };

  function minutesFor(m){
    return { focus: state.minutes.focus, short: state.minutes.short, long: state.minutes.long }[m];
  }

  function setMode(m, resetOnly){
    mode = m;
    document.querySelectorAll(".mode-btn").forEach(b=> b.classList.toggle("active", b.dataset.mode===m));
    totalSeconds = minutesFor(m)*60;
    secondsLeft = totalSeconds;
    timeLabel.textContent = labelFor[m];
    updateReadout();
    updateRing();
  }

  document.querySelectorAll(".mode-btn").forEach(btn=>{
    btn.onclick = ()=>{ pause(); setMode(btn.dataset.mode); };
  });

  function updateReadout(){
    const mm = Math.floor(secondsLeft/60).toString().padStart(2,"0");
    const ss = Math.floor(secondsLeft%60).toString().padStart(2,"0");
    timeReadout.textContent = `${mm}:${ss}`;
    document.title = running ? `${mm}:${ss} · Luna` : "Luna — a quiet place to study";
  }
  function updateRing(){
    const progress = 1 - (secondsLeft/totalSeconds);
    const offset = CIRC * (1-progress);
    moonProgress.style.strokeDashoffset = offset.toFixed(1);
  }

  function start(){
    if(running) return;
    running = true;
    startBtn.textContent = "Pause";
    registerActiveDay();
    tickHandle = setInterval(tick, 1000);
  }
  function pause(){
    running = false;
    startBtn.textContent = "Begin";
    clearInterval(tickHandle);
  }
  function tick(){
    secondsLeft -= 1;
    if(mode==="focus"){
      focusSecondsAccum += 1;
      state.totalFocusMinutes = state.totalFocusMinutes + (1/60);
      if(focusSecondsAccum % 60 === 0){
        const rect = startBtn.getBoundingClientRect();
        earnCoins(1, rect.left+rect.width/2, rect.top);
      }
      if(focusSecondsAccum % 5 === 0) save();
    }
    updateReadout();
    updateRing();
    if(secondsLeft<=0){
      completeSession();
    }
  }

  function completeSession(){
    pause();
    if(mode==="focus"){
      state.sessionsToday += 1;
      const bonus = Math.round(minutesFor("focus") * 0.4);
      const rect = startBtn.getBoundingClientRect();
      earnCoins(bonus, rect.left+rect.width/2, rect.top);
      toast(`session complete — +${bonus} ✦ bonus starlight`);
      renderSessionDots();
      chime();
      const nextMode = (state.sessionsToday % 4 === 0) ? "long" : "short";
      setMode(nextMode);
    } else {
      toast("rest complete — ready when you are");
      chime();
      setMode("focus");
    }
    save();
  }

  function renderSessionDots(){
    const wrap = document.getElementById("sessionDots");
    wrap.innerHTML = "";
    const doneCount = state.sessionsToday % 4 === 0 && state.sessionsToday>0 ? 4 : state.sessionsToday % 4;
    for(let i=0;i<4;i++){
      const d = document.createElement("span");
      if(i<doneCount) d.classList.add("done");
      wrap.appendChild(d);
    }
  }

  function chime(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const notes = [660, 880, 990];
      notes.forEach((freq,i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.08, ctx.currentTime + i*0.15 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.15 + 0.5);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i*0.15);
        osc.stop(ctx.currentTime + i*0.15 + 0.55);
      });
    }catch(e){}
  }

  startBtn.onclick = ()=> running ? pause() : start();
  document.getElementById("resetBtn").onclick = ()=>{ pause(); setMode(mode); };
  document.getElementById("skipBtn").onclick = ()=>{ pause(); completeSessionSkip(); };
  function completeSessionSkip(){
    secondsLeft = 0;
    completeSession();
  }

  ["focusMin","shortMin","longMin"].forEach(id=>{
    document.getElementById(id).addEventListener("change", e=>{
      const key = id.replace("Min","");
      let v = parseInt(e.target.value,10);
      if(isNaN(v)||v<1) v = key==="focus"?25:(key==="short"?5:15);
      state.minutes[key] = v;
      save();
      if(mode===key) setMode(mode);
    });
  });

  document.getElementById("focusMin").value = state.minutes.focus;
  document.getElementById("shortMin").value = state.minutes.short;
  document.getElementById("longMin").value = state.minutes.long;

  // ---------------- init ----------------
  applyEquipped();
  refreshCoinUI();
  refreshStreakUI();
  renderSessionDots();
  setMode("focus");
})();
</script>
</body>
</html>
